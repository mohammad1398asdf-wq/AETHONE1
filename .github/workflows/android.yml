```yaml
name: Build AETHONE APKs

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethone-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check project files
        run: |
          test -f gradlew
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK files
        if: success()
        shell: bash
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' \
            -exec cp {} release-apks/ \;

          cd release-apks
          for file in *.apk; do
            [ -f "$file" ] || continue
            case "$file" in
              *universal*) new="AETHONE-universal-debug.apk" ;;
              *arm64-v8a*) new="AETHONE-arm64-v8a-debug.apk" ;;
              *armeabi-v7a*) new="AETHONE-armeabi-v7a-debug.apk" ;;
              *x86_64*) new="AETHONE-x86_64-debug.apk" ;;
              *) new="AETHONE-debug.apk" ;;
            esac
            if [ "$file" != "$new" ]; then
              mv "$file" "$new"
            fi
          done

          ls -lh

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AETHONE-APKs
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AETHONE-build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
```
